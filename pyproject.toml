[project]
name = "grimoire"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "William Everby", email = "wmckeever@bennettpump.com" }
]
requires-python = ">=3.8"
dependencies = [
    "ipykernel>=6.29.5",
    "matplotlib>=3.7.5",
    "micrograd>=0.1.0",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "pysys>=2.2",
    "scikit-learn>=1.3.2",
    "scipy>=1.10.1",
    "sympy>=1.13.3",
    "tqdm>=4.70.0",
]

[project.scripts]
grimoire = "grimoire:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
